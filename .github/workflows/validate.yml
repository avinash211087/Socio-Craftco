name: Validate website

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check preview.js
          node --check pay.js
          node --check chat.js
          node --check api/razorpay-order.js
          node --check api/razorpay-verify.js

      - name: Run smoke checks
        run: node tests/smoke.test.mjs
